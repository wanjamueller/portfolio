<section id="hero" class="hero-wrapper">
  <div class="hero-content">
    <div class="hero-main">
      <figure class="photo">
        <img class="photo__pic" src="./assets/img/polaroid.jpg" alt="Portrait of Wanja Mueller" />
        <img
          class="photo__frame"
          src="./assets/img/03_stickers/polaroid-frame.webp"
          alt="polaroid-frame"
        />
        <figcaption>
          Wanja
          <span class="smiley">
            <span class="smiley__old">:)</span>
            <span class="smiley__new" aria-hidden="true">:D</span>
          </span>
        </figcaption>
      </figure>
      <a routerLink="/" fragment="about" class="hello"
        ><img class="hello-icon" src="../assets/img/icons/waving_hand.svg" alt="waving-hand" />
        <span class="swap">
          <span class="swap__default">Hello World</span>
          <span class="swap__hover" aria-hidden="true">Hi. I'm Wanja Mueller</span>
        </span></a
      >
      <div class="hero-text">
        <div class="front">
          <p aria-label="Frontend">
            @for (char of frontChars; track $index) {
              <span
                class="char"
                [class.char--upper]="char === char.toUpperCase()"
                aria-hidden="true"
              >
                <span class="char__ghost">{{ char }}</span>
                <span class="char__shown">{{ char }}</span>
              </span>
            }
          </p>
        </div>
        <div class="dev">
          <p aria-label="DEVELOPER">
            @for (char of devChars; track $index) {
              <span
                class="char"
                [class.char--upper]="char === char.toUpperCase()"
                aria-hidden="true"
              >
                <span class="char__ghost">{{ char }}</span>
                <span class="char__shown">{{ char }}</span>
              </span>
            }
          </p>
        </div>
      </div>
      <a routerLink="/" fragment="contact" class="touch">Get in Touch</a>
    </div>
    <div class="social">
      <div class="linkedin social-icon">
        <a href="https://www.linkedin.com/in/wanjamueller/" target="_blank"
          ><img src="./assets/img/icons/linkedin.svg" alt="linkedIn-icon"
        /></a>
      </div>
      <div class="git social-icon">
        <a href="https://github.com/wanjamueller" target="_blank"
          ><img src="./assets/img/icons/git.svg" alt="git-icon"
        /></a>
      </div>
      <div class="mail social-icon">
        <a href="mailto:me@wanjamueller.com" target="_blank"
          ><img src="./assets/img/icons/mail.svg" alt="mail-icon"
        /></a>
      </div>
    </div>
  </div>
</section>
