<header
  id="header"
  [class.scrolled]="scrolled"
  [class.project]="onProject()"
  [class.menu-open]="menuOpen()"
>
  <a routerLink="/" fragment="hero" class="logo" (click)="closeMenu()" aria-label="Home"></a>
  <section class="language-picker">
    <button>
      EN<img
        class="box"
        src="./assets/img/00_hand-drawn-lines/00_header/toggle.webp"
        alt="box-marker"
      />
    </button>
    <div class="language-icon">
      <img class="bar" src="./assets/img/icons/language-bar.svg" alt="" />
      <img class="mark" src="./assets/img/icons/language-mark.svg" alt="" />
    </div>
    <button>
      DE<img
        class="box"
        src="./assets/img/00_hand-drawn-lines/00_header/toggle.webp"
        alt="box-marker"
      />
    </button>
  </section>
  <!-- burger: only visible ≤ 768px -->
  <button
    class="burger"
    [class.open]="menuOpen()"
    [class.pressing]="pressing()"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="mobile-menu"
    [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
  >
    <svg class="icon icon--menu"><use href="assets/icons/icons.svg#menu"></use></svg>
    <svg class="icon icon--menu-hover"><use href="assets/icons/icons.svg#menu-hover"></use></svg>
    <svg class="icon icon--close"><use href="assets/icons/icons.svg#close"></use></svg>
    <svg class="icon icon--close-hover"><use href="assets/icons/icons.svg#close-hover"></use></svg>
  </button>
</header>

<!-- 1) what you SEE: text only, blended on project pages -->
<nav class="nav nav--text" [class.project]="onProject()" aria-hidden="true">
  <ul>
    <li><span>About me</span></li>
    <li><span>Skills</span></li>
    <li><span>Projects</span></li>
    <li><span>Contact</span></li>
  </ul>
</nav>

<!-- 2) what you CLICK: real links + markers, text transparent -->
<nav class="nav nav--links">
  <ul>
    <li>
      <a routerLink="/" fragment="about"
        >About me<img class="circle" src="./assets/img/00_hand-drawn-lines/00_header/1.webp" alt=""
      /></a>
    </li>
    <li>
      <a routerLink="/" fragment="skills"
        >Skills<img
          class="underline"
          src="./assets/img/00_hand-drawn-lines/00_header/2.webp"
          alt=""
      /></a>
    </li>
    <li>
      <a routerLink="/" fragment="projects"
        >Projects<img class="wave" src="./assets/img/00_hand-drawn-lines/00_header/4.webp" alt=""
      /></a>
    </li>
    <li>
      <a routerLink="/" fragment="contact"
        >Contact<img class="line" src="./assets/img/00_hand-drawn-lines/00_header/3.webp" alt=""
      /></a>
    </li>
  </ul>
</nav>
<div id="mobile-menu" class="mobile-menu" [class.open]="menuOpen()">
  <nav>
    <a routerLink="/" fragment="about" (click)="closeMenu()">About me</a>
    <a routerLink="/" fragment="skills" (click)="closeMenu()">Skills</a>
    <a routerLink="/" fragment="projects" (click)="closeMenu()">Projects</a>
    <a routerLink="/" fragment="contact" (click)="closeMenu()">Contact</a>
  </nav>

  <section class="language-picker">
    <!-- copy of the same EN / language-icon / DE markup -->
  </section>

  <div class="socials">
    <a href="https://www.linkedin.com/in/wanjamueller/" target="_blank" aria-label="LinkedIn">
      <svg><use href="assets/icons/icons.svg#linkedin"></use></svg>
    </a>
    <a href="https://github.com/wanjamueller" target="_blank" aria-label="GitHub">
      <svg><use href="assets/icons/icons.svg#github"></use></svg>
    </a>
    <a href="mailto:me@wanjamueller.com" aria-label="Email">
      <svg viewBox="0 0 24 20"><use href="assets/icons/icons.svg#mail"></use></svg>
    </a>
  </div>
</div>
